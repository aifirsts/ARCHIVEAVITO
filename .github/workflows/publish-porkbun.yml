name: Publish to Porkbun (usaforru.shop)

on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Удалять в корне файлы, которых нет в сборке"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: porkbun
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Offline checks
        run: python -m unittest discover -s tests
      - name: Rebuild the storefront from sources
        run: |
          python handoff/generate.py
          python site/build.py
      - name: Upload site/public to Porkbun over FTPS
        env:
          PORKBUN_FTP_HOST: ${{ secrets.PORKBUN_FTP_HOST }}
          PORKBUN_FTP_USER: ${{ secrets.PORKBUN_FTP_USER }}
          PORKBUN_FTP_PASS: ${{ secrets.PORKBUN_FTP_PASS }}
        run: |
          if [ "${{ inputs.prune }}" = "true" ]; then
            python deploy/publish_porkbun.py --prune
          else
            python deploy/publish_porkbun.py
          fi
      - name: Smoke-check the live site
        run: |
          for path in / /sitemap.xml /robots.txt /podbor.html /sources.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 "https://usaforru.shop${path}")
            echo "${path} -> ${code}"
            test "$code" = "200"
          done
