name: Archive and handoff integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate archive, assets, links and handoff feed
        run: python -m unittest discover -s tests -v
      - name: Check source syntax
        run: |
          python -m compileall -q avito_audit handoff tests
          node --check catalog.js
      - name: Verify deterministic generated handoff
        run: |
          python handoff/generate.py
          git diff --exit-code -- handoff/storefront.json
